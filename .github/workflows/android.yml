name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7 (no wrapper jar is committed; add one later with `gradle wrapper`)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        run: gradle --no-daemon :core:test :catalog:test :data:testDebugUnitTest

      - name: Build mobile and TV debug APKs
        run: gradle --no-daemon :app-mobile:assembleDebug :app-tv:assembleDebug

      - name: Verify and collect APKs
        run: |
          set -e
          mkdir -p dist
          mobile=$(find app-mobile/build/outputs/apk/debug -name '*.apk' | head -n1)
          tv=$(find app-tv/build/outputs/apk/debug -name '*.apk' | head -n1)
          test -s "$mobile" || { echo "::error::Mobile APK missing"; exit 1; }
          test -s "$tv" || { echo "::error::TV APK missing"; exit 1; }
          cp "$mobile" dist/EnterLib-Mobile.apk
          cp "$tv" dist/EnterLib-TV.apk
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: EnterLib-APKs
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
